<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lauren Webb - Sculptor & Painter</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      background: #f5f0eb;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #3a3a3a;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #777;
      font-style: italic;
    }

    .viewer-container {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 1;
      max-height: 70vh;
      margin: 1rem auto 2rem;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      background: #e8e2da;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    .piece-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .piece-title h2 {
      font-size: 1.4rem;
      font-weight: 400;
    }

    .piece-title p {
      font-size: 0.85rem;
      color: #999;
      margin-top: 0.3rem;
    }

    footer {
      margin-top: auto;
      padding: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Lauren Webb</h1>
    <p>Sculpture & Painting</p>
  </header>

  <div class="viewer-container">
    <model-viewer
      src="fish-egg.glb"
      alt="Fish Egg sculpture by Lauren Webb"
      auto-rotate
      camera-controls
      shadow-intensity="1"
      environment-image="neutral"
      tone-mapping="commerce"
    ></model-viewer>
  </div>

  <div class="piece-title">
    <h2>Fish Egg</h2>
    <p>Interactive 3D — click and drag to rotate</p>
  </div>

  <footer>
    &copy; 2026 Lauren Webb
  </footer>
</body>
</html>
