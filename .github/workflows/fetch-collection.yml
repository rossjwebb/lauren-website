name: Fetch collection images
on:
  push:
    paths: ['.github/workflows/fetch-collection.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    if: github.ref == 'refs/heads/claude/lauren-website-access-tdkl8g'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from shared Drive folder
        run: |
          mkdir -p _incoming
          ids="1pmNfHaRk4QQRJ5a3T2GYwuOWMkzKOvLS 1fmtWZtAl0zMRaSWQ437IDC94OY5U7hGw 1FvAH60isdIoIz-Zek7dexbS0qAN3LGFD 1sGcP8WDVGQPoI2_HsKuhjYZ55cdoNFgX 1irQzehsTSU2B_BUOWXyn0u42I1IWRmUO 1GJVMx1tpNP1xL62bDuwVJnChzwuSTvyI 1giRB2WV4INu08Jgozd6P5gYShKnnpUr_ 1CU2vkSGex9lhUByHp9RzhVCTmLWcwltA"
          i=1
          for id in $ids; do
            curl -sSL -o "_incoming/img$i.jpg" "https://drive.google.com/uc?export=download&id=$id"
            file "_incoming/img$i.jpg" | grep -q 'JPEG image data' || { echo "img$i is not a JPEG"; exit 1; }
            i=$((i+1))
          done
          ls -la _incoming
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _incoming
          git commit -m "Import collection photography for review (temporary)"
          git push
