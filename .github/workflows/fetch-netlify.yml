name: Fetch Netlify page
on:
  push:
    paths: ['.github/workflows/fetch-netlify.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    if: github.ref == 'refs/heads/claude/lauren-website-access-tdkl8g'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the page and its assets
        run: |
          mkdir -p _import
          cd _import
          wget --no-verbose \
               --page-requisites \
               --adjust-extension \
               --convert-links \
               --span-hosts \
               --domains gilded-kashata-0b67a3.netlify.app \
               --level 1 \
               https://gilded-kashata-0b67a3.netlify.app/ || true
          echo "--- fetched tree ---"
          find . -type f | head -100
          du -sh .

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _import
          git commit -m "Import Netlify page for review (temporary)"
          git push
